[package]
name = "skyhook"
version = "0.5.0"
description = "Skyhook desktop shell — a view and a supervisor over the Node sidecar"
edition = "2021"
# Windows x64 first. The shell links no native Node module: the server is a
# child process, so `better-sqlite3` keeps the ABI CI tests.
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
