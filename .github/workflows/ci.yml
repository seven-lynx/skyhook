name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The installer is a release artifact, never a pull-request gate (`40-delivery.md`):
  # the guard below keeps this job off every PR, so `npm ci` → `npm test` above stays
  # the whole PR surface. `workflow_dispatch` exists so the bundle can be exercised
  # without cutting a tag. The runner image already carries rustup and the MSVC linker;
  # `tauri-cli` is installed the way `desktop/sidecar.json`'s Q5 default says, not as an
  # npm dependency.
  desktop:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup default stable
      - run: cargo install tauri-cli --version "^2" --locked
      - run: npm ci
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: skyhook-installer
          path: dist/desktop/*.exe
